
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Home Page</h2>
    <span>Hello Visitor,</span>

    <form method="POST">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">Apply</button>
    </form>
    <br> <hr>

    <form method="GET">
        <select name="status">
            <option value="" {% if application_status == '' %}selected{% endif %}>All Categories</option>

            <option value="applied" {% if application_status == 'applied' %}selected{% endif %}>Applied</option>

            <option value="interviewed" {% if application_status == 'interviewed' %}selected{% endif %}>Interviewed</option>

            <option value="rejected" {% if application_status == 'rejected' %}selected{% endif %}>Rejected</option>

            <option value="selected" {% if application_status == 'selected' %}selected{% endif %}>Selected</option>
        </select>
        <button type="submit">Filter</button>
    </form>
    <br><br>
    {%for application in job_applications%}
        {{application.company}} - {{application.job_title}} - {{application.status}} - {{application.applied_date}}
        <a href="{% url 'edit' application.id %}">Edit</a>
        <form method="POST" 
            action="{% url 'delete' application.id %}"
            onsubmit="return confirm('Sure to delete?')">
            {% csrf_token %}
            <button type="submit">Delete</button>
        </form>
    {%empty%}
    <p>No applications</p>
    {% endfor %}
</body>
</html>
